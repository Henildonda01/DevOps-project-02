name: Terragrunt Init, Plan or Apply
run-name: Terragrunt Init, Plan or Apply - ${{ inputs.environment }} - ${{ inputs.module }}

on:
  workflow_dispatch:
    inputs:
      applyPlan:
        type: boolean
        description: Apply terraform plan
        required: false

      environment:
        type: choice
        description: Choose Environment Type
        default: prod
        options:
          - prod

      module:
        type: choice
        description: Choose Module
        default: tenant
        options:
          - tenant

permissions:
  id-token: write
  contents: read

jobs:
  terragrunt-init-plan-apply:
    name: Terragrunt Init, Plan or Apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.2'
          terraform_wrapper: false

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: 0.80.3

      - name: Terragrunt Init
        run: |
          cd infrastructure/config/${{ inputs.environment }}/${{ inputs.module }}
          terragrunt init

      - name: Terragrunt Plan
        run: |
          cd infrastructure/config/${{ inputs.environment }}/${{ inputs.module }}
          terragrunt plan -out=../plan

      - name: Terragrunt Apply
        if: ${{ inputs.applyPlan == true }}
        run: |
          cd infrastructure/config/${{ inputs.environment }}/${{ inputs.module }}
          terragrunt apply -auto-approve ../plan

      - name: Terragrunt Output
        run: |
          cd infrastructure/config/${{ inputs.environment }}/${{ inputs.module }}
          terragrunt output

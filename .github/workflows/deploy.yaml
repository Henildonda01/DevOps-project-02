name: Deploy Chat App to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ ! -d ~/DevOps-project-02/.git ]; then
              git clone https://github.com/Henildonda01/DevOps-project-02.git ~/DevOps-project-02
            fi
            cd ~/DevOps-project-02
            git pull origin main
            docker compose down
            docker compose up -d --build
